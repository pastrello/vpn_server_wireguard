<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>{% block title %}VPNHub{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
<div class="app-shell">
    <aside class="sidebar">
        <a class="brand" href="{{ url_for('main.dashboard') }}">
            <span class="brand-mark">V</span>
            <span>
                <strong>VPNHub</strong>
                <small>WireGuard Manager</small>
            </span>
        </a>

        <nav class="nav-menu">
            <a href="{{ url_for('main.dashboard') }}">
                <span class="nav-icon">⌂</span> Dashboard
            </a>
            <a href="{{ url_for('main.status_page') }}">
                <span class="nav-icon">◉</span> Status
            </a>
            <a href="{{ url_for('main.site_new') }}">
                <span class="nav-icon">＋</span> Novo Site
            </a>
            <a href="{{ url_for('main.admin_peer_new') }}">
                <span class="nav-icon">◆</span> Admin Peer
            </a>
        </nav>

        <div class="sidebar-footer">
            <span class="environment-badge">v0.4</span>
            <form method="post" action="{{ url_for('auth.logout') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <button class="link-button" type="submit">Sair</button>
            </form>
        </div>
    </aside>

    <main class="main-content">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }}">
                    <span>{{ message }}</span>
                    <button type="button" onclick="this.parentElement.remove()">×</button>
                </div>
            {% endfor %}
        {% endwith %}

        {% block content %}{% endblock %}
    </main>
</div>

<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
