name: VPNHub CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Compile Python
        run: |
          python -m compileall -q vpnhub controller scripts migrations

      - name: Validate shell scripts
        run: |
          for file in scripts/*.sh; do
            bash -n "$file"
          done

      - name: Run tests
        env:
          DATABASE_URL: sqlite:///:memory:
          SECRET_KEY: ci-secret-key
          PSK_ENCRYPTION_KEY: 4piYv6j6VlaOlouohzC30YNleA-f3OiiUYZ8S7hfxlA=
          VPN_ENDPOINT: vpn.example.com:51820
          VPN_SERVER_PUBLIC_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          WG_DRY_RUN: "true"
        run: pytest -q
