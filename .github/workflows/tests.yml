name: VPNHub CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Compile Python
        run: |
          python -m compileall -q vpnhub controller scripts migrations

      - name: Validate shell scripts
        run: |
          for file in scripts/*.sh; do
            bash -n "$file"
          done

      - name: Run tests
        env:
          DATABASE_URL: "sqlite:///:memory:"
          SECRET_KEY: "ci-secret-key"
          PSK_ENCRYPTION_KEY: "4piYv6j6VlaOlouohzC30YNleA-f3OiiUYZ8S7hfxlA="
          VPN_ENDPOINT: "vpn.example.com:51820"
          VPN_SERVER_PUBLIC_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          WG_DRY_RUN: "true"
        run: pytest -q

  windows-client:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore client
        run: dotnet restore windows-client/VPNHub.Client/VPNHub.Client.csproj

      - name: Build client
        run: dotnet build windows-client/VPNHub.Client/VPNHub.Client.csproj -c Release --no-restore

      - name: Test client core
        run: dotnet test windows-client/VPNHub.Client.Tests/VPNHub.Client.Tests.csproj -c Release

      - name: Publish win-x64
        run: dotnet publish windows-client/VPNHub.Client/VPNHub.Client.csproj -c Release -r win-x64 --self-contained false -o windows-client/artifacts/win-x64

      - name: Upload Windows client artifact
        uses: actions/upload-artifact@v4
        with:
          name: VPNHub.Client-win-x64
          path: windows-client/artifacts/win-x64/
          if-no-files-found: error
